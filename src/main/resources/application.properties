spring.application.name=art-bridge-backend
spring.config.import=optional:file:./.env[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
jwt.access-cookie-name=jwt
jwt.refresh-cookie-name=refresh

s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.bucket=${S3_BUCKET:photos}
s3.public-base-url=${PUBLIC_MEDIA_BASE_URL:http://localhost:9000}