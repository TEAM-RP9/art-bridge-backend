name: Deploy Backend

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: artbridge-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VM_PORT }}" -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend to VM
        run: |
          ssh -p "${{ secrets.VM_PORT }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            set -e

            cd /home/ubuntu/rp9/art-bridge-backend
            git fetch --all
            git checkout main
            git pull --ff-only

            cd /home/ubuntu/rp9/infra
            sudo docker compose up -d --build --no-deps backend

            sudo docker image prune -f
            sudo docker builder prune -f

            for i in $(seq 1 24); do
              if curl -fsS --max-time 5 http://localhost/api/actuator/health > /dev/null 2>&1; then
                echo "Backend healthy"
                break
              fi
              if [ $i -eq 24 ]; then
                echo "Backend did not become healthy after 2 minutes"
                echo "=== Backend logs ==="
                sudo docker compose logs --tail=100 backend
                exit 1
              fi
              echo "Attempt $i/24 - not ready yet, retrying in 5s..."
              sleep 5
            done

            sudo docker compose ps backend
          '
